plugins {
    alias(libs.plugins.android.application)
}

def signingPropertiesFile = rootProject.file("signing.local.properties")
def signingProperties = new Properties()

if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream {
        signingProperties.load(it)
    }
}

android {
    namespace 'com.book.mask'
    compileSdk 35

    defaultConfig {
        applicationId "com.book.mask"
        minSdk 24
        targetSdk 35
        versionCode 71
        versionName "3.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 只保留主流真机 ABI（arm64-v8a）与模拟器 ABI（x86_64），缩小安装包体积
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]

                // 与 Android Studio 生成的现有 APK 保持一致：仅启用 V2 签名。
                enableV1Signing false
                enableV2Signing true
                enableV3Signing false
                enableV4Signing false
            }
        }
    }

    buildTypes {
        release {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'ProtectedPermissions'
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.lifecycle.process
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.tencent:mmkv:2.4.0'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
